name: Deploy to GitHub Pages

# One Pages site, three builds:
#   /          production  - built from the main branch
#   /staging/  staging     - built from the staging branch (new changes are tried here first)
#   /angular/  Angular     - built from the angular branch (Angular version of the app)
# Pushes to staging or angular start this workflow through staging-trigger.yml, so the
# deployment always runs from main (the only branch allowed to deploy to Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check out staging
        id: staging
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: staging
          path: staging-src
      - name: Build staging into /staging/
        if: steps.staging.outcome == 'success'
        working-directory: staging-src
        run: |
          npm ci
          npm run build
          cp -r dist ../dist/staging

      - name: Check out angular
        id: angular
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: angular
          path: angular-src
      - name: Build the Angular version into /angular/
        if: steps.angular.outcome == 'success'
        working-directory: angular-src
        run: |
          npm ci
          npm run build
          cp -r dist/docs-viewer/browser ../dist/angular

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
