name: Deploy staging

# A push to the staging or angular branch re-runs the Pages deployment from main, which
# builds production (/), staging (/staging/) and the Angular version (/angular/).
on:
  push:
    branches: [staging, angular]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
